name: Docker Build & Push on Github

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
env:
  # Dynamic construction: username/github-repo-name
  IMAGE_NAME: mundial2026
  REGISTRY: docker.io

jobs:
  build-and-publish:
    runs-on: ubuntu-latest 
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1 Checkout del codigo
        uses: actions/checkout@v4

      - name: 2. Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: 3. Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Autenticarse en Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 5. Extraer metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}


      - name: 6. Construir y publicar la imagen
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: mundial2026
          labels: latest
          cache-from/cache-to: type=gha
          platforms: linux/amd64
  
  deploy:
    needs: build-and-publish # It will not start until the previous job has successfully completed.
    runs-on: self-hosted 
    
    steps:
      - name: Code checkout (Manifiesto K8s)
        uses: actions/checkout@v4

      - name: Set up kubectl
        run: |
          # Install kubectl if not already available
          if ! command -v kubectl &> /dev/null; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
          fi

      - name: Update deployment image
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7) kubectl set image deployment/${{ env.IMAGE_NAME }} ${{env.IMAGE_NAME }}=${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME}}/${{ env.IMAGE_NAME }}:sha-$sha

      - name: Wait for deployment rollout
        run: |
          # Wait for the deployment to complete
          kubectl rollout status deployment/${{ env.IMAGE_NAME }} --timeout=30s
      
      - name: Verify deployment
        run: |
          # Get deployment status
          kubectl get deployment ${{ env.IMAGE_NAME }}
          
          # Get pod status
          kubectl get pods -l app=${{ env.IMAGE_NAME }}
          
          # Show recent events
          kubectl get events --sort-by='.lastTimestamp' | Select-Object -Last 10 
